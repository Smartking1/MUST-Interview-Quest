<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor Market Support</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --ink:#1d2330; --muted:#667085; --line:#e3e6ea;
          --trusted:#1f6f4a; --unsafe:#b42318; --user:#e8eefc; --bot:#f2f4f7; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:14px 20px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0 auto 0 0; }
  .modes button { border:1px solid var(--line); background:#fff; padding:6px 12px; cursor:pointer; font:inherit; }
  .modes button:first-child { border-radius:6px 0 0 6px; } .modes button:last-child { border-radius:0 6px 6px 0; }
  .modes button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  header a { color:var(--muted); }
  details { padding:8px 20px 0; color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:12px 20px; height:calc(100vh - 150px); }
  main.single { grid-template-columns:1fr; height:calc(100vh - 110px); }
  .pane { background:var(--panel); border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column; min-height:0; }
  .pane[hidden] { display:none; }
  .pane h2 { margin:0; padding:10px 14px; font-size:14px; border-bottom:1px solid var(--line); }
  .pane.trusted h2 { color:var(--trusted); } .pane.baseline h2 { color:var(--unsafe); }
  .log { flex:1; overflow:auto; padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
  .msg { padding:8px 12px; border-radius:10px; max-width:85%; white-space:pre-wrap; }
  .msg.user { background:var(--user); align-self:flex-end; }
  .msg.bot { background:var(--bot); align-self:flex-start; }
  .msg.err { background:#fde8e8; color:var(--unsafe); }
  .msg.note { align-self:center; background:none; color:var(--muted); font-size:12px; padding:0; }
  .composer { border-top:1px solid var(--line); padding:10px; }
  .composer form { display:flex; gap:8px; }
  .composer textarea { flex:1; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; resize:none; height:46px; }
  .composer button { padding:0 16px; font:inherit; border:0; border-radius:8px; background:var(--ink); color:#fff; cursor:pointer; }
  .photo { display:flex; align-items:center; padding:0 10px; border:1px solid var(--line); border-radius:8px; cursor:pointer; color:var(--muted); background:#fff; font-size:14px; }
  .photo-name { color:var(--muted); font-size:12px; min-height:1em; margin-top:4px; }
  .both { margin:0 20px 14px; background:var(--panel); border:1px dashed var(--muted); border-radius:10px; }
  .both[hidden] { display:none; }
  .both .label { font-size:12px; color:var(--muted); padding:8px 10px 0; }
  .both button { background:var(--muted); }
  @media (max-width: 760px) {
    main, main.single { grid-template-columns:1fr; height:auto; }
    .log { min-height:260px; }
    .both { margin:0 16px 14px; }
  }
</style>
</head>
<body>
<header>
  <h1>Harbor Market Support</h1>
  <div class="modes" role="group" aria-label="Agent">
    <button data-mode="trusted" class="on">Trusted Support</button>
    <button data-mode="both">Side by side</button>
    <button data-mode="baseline">Baseline (unsafe)</button>
  </div>
  <button id="reset" title="Start new conversations">New chat</button>
  <a href="/admin">Staff admin</a>
  <a href="/lab">Test Lab</a>
</header>
<details><summary>Demo orders (fictional)</summary><div id="orders"></div></details>
<main id="main" class="single">
  <section class="pane trusted" data-agent="trusted">
    <h2>Trusted Support</h2>
    <div class="log" id="log-trusted"></div>
    <div class="composer" id="composer-trusted"></div>
  </section>
  <section class="pane baseline" data-agent="baseline" hidden>
    <h2>Baseline: conventional agent, unsafe, for comparison only</h2>
    <div class="log" id="log-baseline"></div>
    <div class="composer" id="composer-baseline"></div>
  </section>
</main>
<div class="both composer" id="composer-both" hidden>
  <div class="label">Send to both: use this for the opening message, so both agents get the identical request. Then reply to each one in its own pane.</div>
</div>
<script>
const AGENTS = ["trusted", "baseline"];
const state = { mode: "trusted", ids: { trusted: null, baseline: null } };
const $ = id => document.getElementById(id);

function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll(".modes button").forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
  document.querySelector(".pane.trusted").hidden = mode === "baseline";
  document.querySelector(".pane.baseline").hidden = mode === "trusted";
  $("main").classList.toggle("single", mode !== "both");
  $("composer-both").hidden = mode !== "both";
}
document.querySelectorAll(".modes button").forEach(b => b.onclick = () => setMode(b.dataset.mode));

function add(agent, cls, text) {
  const log = $("log-" + agent);
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

async function send(agent, message, image) {
  add(agent, "user", image ? message + "\n[photo: " + image.name + "]" : message);
  const pending = add(agent, "bot", "...");
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, agent, conversation_id: state.ids[agent],
        image_base64: image ? image.base64 : null, image_mime: image ? image.mime : null }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    state.ids[agent] = data.conversation_id;
    pending.textContent = data.reply;
  } catch (e) {
    pending.className = "msg err";
    pending.textContent = "Error: " + e.message;
  }
}

// One input box: text, optional photo, Enter to send. `targets` returns which agents receive the message.
function makeComposer(container, placeholder, buttonText, targets) {
  let photo = null;
  const form = document.createElement("form");
  const label = document.createElement("label");
  label.className = "photo"; label.title = "Attach a photo (JPEG, PNG or WebP, up to 5 MB)"; label.textContent = "Photo";
  const file = document.createElement("input");
  file.type = "file"; file.accept = "image/jpeg,image/png,image/webp"; file.hidden = true;
  label.appendChild(file);
  const input = document.createElement("textarea");
  input.placeholder = placeholder; input.required = true;
  const button = document.createElement("button");
  button.textContent = buttonText;
  const note = document.createElement("div");
  note.className = "photo-name";
  form.append(label, input, button);
  container.append(form, note);

  file.onchange = () => {
    const f = file.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      photo = { base64: reader.result.split(",")[1], mime: f.type, name: f.name };
      note.textContent = "Attached: " + f.name + " (sent with the next message)";
    };
    reader.readAsDataURL(f);
  };
  form.onsubmit = e => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    const image = photo;
    input.value = ""; photo = null; file.value = ""; note.textContent = "";
    targets().forEach(agent => send(agent, message, image));
  };
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
}

makeComposer($("composer-trusted"), "Message Trusted Support. Include your order number and email for order help.", "Send", () => ["trusted"]);
makeComposer($("composer-baseline"), "Message the baseline agent.", "Send", () => ["baseline"]);
makeComposer($("composer-both"), "Opening message for both agents.", "Send to both", () => AGENTS);

$("reset").onclick = () => {
  state.ids = { trusted: null, baseline: null };
  AGENTS.forEach(a => { $("log-" + a).innerHTML = ""; add(a, "note", "New conversation"); });
};

fetch("/api/demo/customers").then(r => r.json()).then(rows => {
  $("orders").textContent = rows.map(r => `${r.order_number}  ${r.email}  (${r.status})`).join("\n");
  $("orders").style.whiteSpace = "pre";
}).catch(() => {});
</script>
</body>
</html>
