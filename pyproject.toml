[project]
name = "trusted-support"
version = "0.1.0"
description = "A customer support agent that can be trusted with money"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2.0",
    "langgraph",
    "langchain-openai",
    "inspect-ai",
    "openai",
    "stripe>=16.0.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "evals"]
